name: Supabase Uyandır

# Ücretsiz Supabase projeleri 7 gün hiç istek almazsa duraklatılır.
# Bu workflow düzenli aralıklarla projeye basit bir istek göndererek
# duraklamayı önler.

on:
  schedule:
    # Her 3 günde bir, gece yarısı (UTC) çalışır
    - cron: "0 0 */3 * *"
  workflow_dispatch: {}   # İstersen Actions sekmesinden elle de tetikleyebilirsin

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase projesine istek gönder
        run: |
          curl --fail --silent --show-error \
            "${SUPABASE_URL}/rest/v1/kullanici_verisi?select=user_id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
